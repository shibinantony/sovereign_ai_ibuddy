version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      root-npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      frontend-npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      backend-pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
